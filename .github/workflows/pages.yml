name: Publish Reading Station

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalbox-pages
  queue: max
  cancel-in-progress: false

jobs:
  build:
    if: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Reuse the exact verified reading station
        if: true
        uses: actions/download-artifact@v4
        with:
          name: verified-reading-station
          path: build/site

      - name: Check out source
        if: false
        uses: actions/checkout@v7

      - name: Set up Python
        if: false
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install verification dependencies
        if: false
        run: python -m pip install --requirement requirements-dev.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify source and build the reading station
        if: false
        run: make verify PYTHON=python

      - name: Confirm the artifact comes from unchanged source
        if: false
        run: test -z "$(git status --short)"

      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    if: false # Isolated probe must never publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
