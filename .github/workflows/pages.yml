name: Publish Reading Station

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalbox-pages
  queue: max
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.current.outputs.publish }}
    steps:
      - name: Require the current main source before publication
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" = "$SOURCE_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse the exact verified reading station
        if: steps.current.outputs.publish == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: verified-reading-station
          path: build/site

      - name: Check out source
        if: steps.current.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.current.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install verification dependencies
        if: steps.current.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        run: python -m pip install --requirement requirements-dev.txt

      - name: Configure GitHub Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Verify source and build the reading station
        if: steps.current.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        run: make verify PYTHON=python

      - name: Confirm the artifact comes from unchanged source
        if: steps.current.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        run: test -z "$(git status --short)"

      - name: Upload the generated site
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
